# AI products inside officeerp.analytx4t.com — include from the HTTPS server block:
#     include /etc/nginx/snippets/ss-dimri-ai-products.conf;
# (deploy copies this file there; see ai-products/README.md).
#
# Only the login demo@gmail.com may use them: every page and API request is checked with
# auth_request against the ERP (GET /api/ai-products/auth → 204 allowed, 401/403 refused).
# Hashed JS/CSS bundles are the only files served without the check — they hold no data.
# Static files: $AIP_PUBLIC/ai-products/<slug>/ (published by ai-products/deploy/build.sh).
# Backends listen on 127.0.0.1:8100–8109 (ai-products/deploy/ecosystem.config.cjs).

location = /_aip_auth {
    internal;
    proxy_pass http://127.0.0.1:3000/api/ai-products/auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# Refused page request: let the ERP explain (sign-in page, or "no access").
location @aip_denied {
    absolute_redirect off;
    return 302 /app/ai-products;
}
location @aip_api_denied {
    default_type application/json;
    return 401 '{"error":"Sign in with the AI products account to use this."}';
}

location = /ai-products { absolute_redirect off; return 302 /app/ai-products; }

location ^~ /ai-products/ {
    absolute_redirect off;   # keep redirects relative (https behind the proxy, any port locally)
    root /var/www/ss-dimri-ai-products;
    auth_request /_aip_auth;
    error_page 401 403 = @aip_denied;

    add_header X-Frame-Options SAMEORIGIN always;   # embedded in the ERP's /app/ai-products pages
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "private, no-cache" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets: no data inside, cache for a year, no session check.
    location ~ ^/ai-products/[a-z-]+/assets/ {
        auth_request off;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ---- Trial Balance (financial-reporting) · :8100
    location ^~ /ai-products/financial-reporting/api/ {
        error_page 401 403 = @aip_api_denied;
        proxy_pass http://127.0.0.1:8100/api/;
        include /etc/nginx/snippets/ss-dimri-ai-products-proxy.conf;
        client_max_body_size 50m;     # trial-balance uploads
    }
    location /ai-products/financial-reporting/ { try_files $uri $uri/ /ai-products/financial-reporting/index.html; }

    # ---- Financial Statement Analysis (virtual-cfo) · :8101
    location ^~ /ai-products/virtual-cfo/api/ {
        error_page 401 403 = @aip_api_denied;
        proxy_pass http://127.0.0.1:8101/api/;
        include /etc/nginx/snippets/ss-dimri-ai-products-proxy.conf;
        client_max_body_size 64m;     # four statement PDFs
    }
    location /ai-products/virtual-cfo/ { try_files $uri $uri/ /ai-products/virtual-cfo/index.html; }

    # ---- Bank Reconciliation · :8102
    location ^~ /ai-products/bank-reconciliation/api/ {
        error_page 401 403 = @aip_api_denied;
        proxy_pass http://127.0.0.1:8102/api/;
        include /etc/nginx/snippets/ss-dimri-ai-products-proxy.conf;
        client_max_body_size 25m;
    }
    location /ai-products/bank-reconciliation/ { try_files $uri $uri/ /ai-products/bank-reconciliation/index.html; }

    # ---- Invoice Automation · :8103
    location ^~ /ai-products/invoice-automation/api/ {
        error_page 401 403 = @aip_api_denied;
        proxy_pass http://127.0.0.1:8103/api/;
        include /etc/nginx/snippets/ss-dimri-ai-products-proxy.conf;
        client_max_body_size 200m;    # up to 100 invoice PDFs per batch
    }
    location /ai-products/invoice-automation/ { try_files $uri $uri/ /ai-products/invoice-automation/index.html; }

    # ---- GST Reconciliation (FastAPI) · :8104
    location ^~ /ai-products/gst-reconciliation/api/ {
        error_page 401 403 = @aip_api_denied;
        proxy_pass http://127.0.0.1:8104/api/;
        include /etc/nginx/snippets/ss-dimri-ai-products-proxy.conf;
        client_max_body_size 100m;    # full annual source package
    }
    location /ai-products/gst-reconciliation/ { try_files $uri $uri/ /ai-products/gst-reconciliation/index.html; }

    # ---- TDS Return Preparation & Reconciliation · :8105
    location ^~ /ai-products/tds-return/api/ {
        error_page 401 403 = @aip_api_denied;
        proxy_pass http://127.0.0.1:8105/api/;
        include /etc/nginx/snippets/ss-dimri-ai-products-proxy.conf;
        client_max_body_size 45m;
    }
    location /ai-products/tds-return/ { try_files $uri $uri/ /ai-products/tds-return/index.html; }

    # ---- Vendor Ledger Reconciliation · :8106
    location ^~ /ai-products/vendor-ledger/api/ {
        error_page 401 403 = @aip_api_denied;
        proxy_pass http://127.0.0.1:8106/api/;
        include /etc/nginx/snippets/ss-dimri-ai-products-proxy.conf;
        client_max_body_size 45m;
    }
    location /ai-products/vendor-ledger/ { try_files $uri $uri/ /ai-products/vendor-ledger/index.html; }

    # ---- Customer Ledger Reconciliation · :8107
    location ^~ /ai-products/customer-ledger/api/ {
        error_page 401 403 = @aip_api_denied;
        proxy_pass http://127.0.0.1:8107/api/;
        include /etc/nginx/snippets/ss-dimri-ai-products-proxy.conf;
        client_max_body_size 45m;
    }
    location /ai-products/customer-ledger/ { try_files $uri $uri/ /ai-products/customer-ledger/index.html; }

    # ---- Payroll & Compliance (payroll-compliance) · :8108 — switched off, as on aiproducts.analytx4t.com

    # ---- Fixed Asset Register & Depreciation · :8109
    location ^~ /ai-products/fixed-asset-register/api/ {
        error_page 401 403 = @aip_api_denied;
        proxy_pass http://127.0.0.1:8109/api/;
        include /etc/nginx/snippets/ss-dimri-ai-products-proxy.conf;
        client_max_body_size 150m;    # 4 spreadsheets + up to 10 invoice PDFs
    }
    location /ai-products/fixed-asset-register/ { try_files $uri $uri/ /ai-products/fixed-asset-register/index.html; }

    # Anything else under /ai-products/ (unknown product)
    location /ai-products/ { return 302 /app/ai-products; }
}
