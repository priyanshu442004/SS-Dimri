# Shared proxy settings for the AI products' APIs (included per product by nginx-ai-products.conf).
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";
proxy_read_timeout 600s;      # AI extraction / mapping can be slow
proxy_send_timeout 600s;
proxy_buffering off;          # stream chat tokens (SSE) as they arrive
proxy_request_buffering off;  # large uploads go straight through
